name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test

  # Everything except scan-macos builds here: the app crate uses the portable jwalk walker on
  # Linux (src-tauri/src/platform). The Tauri crates need the GTK/WebKit development libraries.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust format
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --exclude scan-macos --all-targets --features webdriver --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --exclude scan-macos --manifest-path src-tauri/Cargo.toml

  # scan-macos (getattrlistbulk) and the macOS platform module only compile here, and the e2e
  # suite drives the app with that walker, the one that ships.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Clippy
        run: cargo clippy -p unshift-app -p scan-macos --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust tests
        run: cargo test -p unshift-app -p scan-macos --manifest-path src-tauri/Cargo.toml
      - name: Build debug app
        run: cargo build --features webdriver --manifest-path src-tauri/Cargo.toml
      - name: E2E tests
        run: bun run test:e2e
