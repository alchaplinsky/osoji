name: Release

# Manual only. Bump `version` in src-tauri/tauri.conf.json, src-tauri/Cargo.toml
# ([workspace.package]) and package.json before running. This builds, signs, and
# notarizes a universal macOS app and creates a PUBLISHED GitHub release with
# the .dmg, the updater artifact (.app.tar.gz + .sig), and latest.json.
# Publishing makes it available to the in-app auto-updater, which reads
# latest.json straight from the public release (see docs/RELEASING.md).
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        # Both arches are required so Tauri can lipo them into a universal binary.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign keypair generated for Unshift).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application cert) + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Unshift v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: false
          prerelease: false
          tauriScript: bun run tauri
          args: --target universal-apple-darwin

      # Replace the placeholder release body with GitHub's auto-generated
      # release notes (the same "What's Changed" list the UI button produces),
      # built from PRs/commits since the previous release. The updater shows
      # this body in the "Update ready" toast.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          if [ -n "$NOTES" ] && [ "$NOTES" != "null" ]; then
            gh release edit "$TAG" --notes "$NOTES"
          fi
