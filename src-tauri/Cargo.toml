[workspace]
resolver = "2"
members = [".", "crates/scan-core", "crates/scan-macos", "crates/scan-cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[package]
name = "unshift-app"
edition.workspace = true
version.workspace = true

[lib]
name = "unshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scan-core = { path = "crates/scan-core" }
scan-macos = { path = "crates/scan-macos" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
libc = "0.2"
