[workspace]
resolver = "2"
members = [".", "crates/scan-core", "crates/scan-macos", "crates/scan-cli", "crates/scan-policy"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[package]
name = "unshift-app"
edition.workspace = true
version.workspace = true

[lib]
name = "unshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# In-app W3C WebDriver server for the e2e suite (tests/e2e): `cargo build --features webdriver`.
# Off by default so release bundles never carry it.
webdriver = ["dep:tauri-plugin-webdriver"]

[dependencies]
tauri-plugin-webdriver = { version = "0.2", optional = true }
scan-core = { path = "crates/scan-core" }
scan-policy = { path = "crates/scan-policy" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# In-app auto-update from GitHub Releases (src/lib/autoUpdate.ts): `updater`
# checks + stages a signed release, `process` relaunches into it.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
libc = "0.2"

# Non-blocking window zoom (src/zoom.rs). `default-features = false` because these crates'
# defaults compile every class in the framework; only the handful the hook touches are named.
[target.'cfg(target_os = "macos")'.dependencies]
scan-macos = { path = "crates/scan-macos" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSWindow",
    "NSAnimationContext",
    "NSEvent",
] }
