<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osoji</title>
    <!-- Apply the saved appearance before any CSS or React runs, so the first
         paint is already in the right theme instead of flashing the default
         and then transitioning. Mirrors the defaults in src/hooks/useTheme.tsx;
         keep the storage key and fallbacks in sync. -->
    <script>
      (function () {
        var theme = "instrument", layout = "cards";
        try {
          var s = JSON.parse(localStorage.getItem("unshift.appearance") || "{}");
          if (s.theme === "instrument" || s.theme === "glass" || s.theme === "light") theme = s.theme;
          else if (matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
          if (s.layout === "cards" || s.layout === "classic") layout = s.layout;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.layout = layout;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
